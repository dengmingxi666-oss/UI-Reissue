*{box-sizing:border-box}body{margin:0;background:#f0f2f5;font-family:Arial,"Microsoft YaHei","PingFang SC",sans-serif;color:var(--ink)}button,input,textarea,select{font:inherit}button{cursor:pointer}button:disabled{opacity:.35;cursor:default}button:focus-visible,a:focus-visible{outline:2px solid #2563eb;outline-offset:3px}
.topbar{height:66px;padding:0 26px;display:flex;align-items:center;justify-content:space-between;background:white;border-bottom:1px solid var(--line);gap:16px}.brand{display:flex;gap:12px;align-items:center}.brand-mark{height:30px;width:30px;background:#17212b;color:white;display:grid;place-items:center;border-radius:8px;font-size:13px;font-weight:700}.brand strong{font-size:14px;font-weight:600}.brand small{display:block;color:var(--muted);font-size:11px;margin-top:4px}.actions{display:flex;align-items:center;gap:7px}.btn{border:1px solid #e0e4e9;background:white;border-radius:7px;font-size:12px;padding:8px 12px;color:#475569;white-space:nowrap}.btn:hover{background:#f5f7fa}.btn.primary,.btn.active{background:#edf3ff;border-color:#c6d7fc;color:#1d4ed8}.segmented{display:flex;border:1px solid #dfe3e8;border-radius:7px;overflow:hidden}.segmented button{border:0;padding:8px 12px;background:white;color:#64748b;font-size:12px}.segmented button.active{background:#edf3ff;color:#1d4ed8}.status{color:#85909e;font-size:11px;white-space:nowrap}.status::before{content:"";display:inline-block;width:5px;height:5px;border-radius:50%;background:#10b981;margin-right:6px}
.workspace{display:flex;align-items:flex-start;gap:22px;padding:24px;justify-content:center}.canvas-zone{min-width:0;width:965px;flex:0 1 965px}.canvas-caption{display:flex;align-items:center;justify-content:space-between;margin:0 0 11px;font-size:11px;color:#8a94a1}.canvas-caption b{font-weight:400;color:#4b5563}.canvas-wrap{width:100%;overflow:auto;background:#fafafa;box-shadow:0 2px 12px #25345208;border:1px solid #e3e7ec}.stage{width:965px;min-height:665px;position:relative;background:#fafafa;padding:4px 33px 0;overflow:hidden;color:#111}.watermarks{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:0}.watermark{position:absolute;font-size:14px;color:#000;opacity:.032;transform:rotate(23deg);white-space:nowrap}.stage-content{position:relative;z-index:1}.row-wrap{position:relative;min-height:26px}.trace-row{display:flex;align-items:center;min-height:26px;width:fit-content;max-width:100%;gap:7px;padding:0 8px;color:#626970;font-size:13px;line-height:20px;border-radius:5px;position:relative}.trace-row.plain{padding:0;font-size:16px;line-height:24px;color:#111;align-items:center}.trace-row.summary{padding:0;font-size:16px;line-height:24px;color:#657078;gap:5px}.trace-row.tinted{background:#f2f2f2}.row-icon{flex:0 0 16px;width:16px;height:20px;display:flex;align-items:center;justify-content:center;color:#42474b;border:0;background:none;padding:0;border-radius:3px}.row-icon svg{width:16px;height:16px;overflow:visible}.row-icon:hover{background:#e8ebef}.row-text{min-width:6px;outline:none;white-space:pre-wrap;overflow-wrap:anywhere}.row-text[contenteditable="true"]{cursor:text}.edit-mode .trace-row:hover{outline:1px dashed #b6c9ec;outline-offset:3px}.edit-mode .row-wrap.selected>.trace-row{outline:1px solid #93b4f1;outline-offset:3px}.edit-mode .row-text:focus{background:#e9f1ff;box-shadow:0 0 0 3px #e9f1ff;border-radius:2px}.chevron{width:14px;height:18px;border:0;background:transparent;color:#6b7077;padding:0;display:inline-flex;align-items:center; dding:10px 17px;border-radius:8px;background:#17212b;color:#fff;font-size:12px;opacity:0;pointer-events:none;transition:.15s;z-index:100}.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}.danger{color:#b45353}.mobile-panel-toggle{display:none}kbd{font-family:inherit;font-size:10px;background:#f2f4f7;border:1px solid #e4e7ec;border-radius:3px;padding:1px 4px}.inspector.hidden{display:none}
@media(max-width:1240px){.workspace{gap:16px;padding:18px}.inspector{width:265px;flex-basis:265px}.topbar{padding:0 18px}.brand small{display:none}.status{display:none}.actions{gap:5px}.btn{padding:7px 9px}.canvas-zone{flex:1;overflow:hidden}}

<script>
'use strict';
const $=id=>document.getElementById(id);
const copy=value=>JSON.parse(JSON.stringify(value));
const ORIGINAL=JSON.parse($('seed').textContent);
const seedHash=Array.from(JSON.stringify(ORIGINAL)).reduce((hash,ch)=>Math.imul(hash^ch.charCodeAt(0),16777619)>>>0,2166136261).toString(36);
const STORAGE_KEY='aippt-toolcall-replica-v1-'+seedHash;
let state=copy(ORIGINAL),mode='edit',selectedId=null,summaryOpen=true;
const openDetails=new Set(),closedGroups=new Set(),history=[];
const LABELS={summary:'汇总',plain:'正文',think:'思考',file:'读取文件',code:'代码执行',edit:'修改文件',group:'过程分组'};
const TYPES=Object.keys(LABELS);
try{const saved=JSON.parse(localStorage.getItem(STORAGE_KEY));if(validState(saved))state=saved;}catch{}
function validState(v){return !!v&&v.version===1&&v.settings&&typeof v.settings.bg==='string'&&/^#[\da-f]{6}$/i.test(v.settings.bg)&&Number.isFinite(v.settings.gap)&&v.settings.gap>=0&&v.settings.gap<=40&&typeof v.settings.watermarkText==='string'&&Array.isArray(v.nodes)&&v.nodes.length>0&&v.nodes.length<=300&&v.nodes[0].type==='summary'&&new Set(v.nodes.map(n=>n.id)).size===v.nodes.length&&v.nodes.every(n=>n&&typeof n.id==='string'&&TYPES.includes(n.type)&&typeof n.text==='string'&&n.text.length<=15000&&(!n.detail||typeof n.detail==='string')&&(n.indent===undefined||Number.isFinite(n.indent)&&n.indent>=0&&n.indent<=3)&&(n.size===undefined||Number.isFinite(n.size)&&n.size>=10&&n.size<=28)&&(n.color===undefined||/^#[\da-f]{6}$/i.test(n.color)));}
function save(){try{localStorage.setItem(STORAGE_KEY,JSON.stringify(state));$('save-status').textContent='改动已自动保存';}catch{$('save-status').textContent='可导出文件保存改动';}}
function mutate(fn){history.push(copy(state));if(history.length>100)history.shift();fn();save();render();}
function nodeById(id){return state.nodes.find(n=>n.id===id);}
function selected(){return nodeById(selectedId);}
function svgIcon(type){return `<svg aria-hidden="true"><use href="#icon-${type==='think'?'think':type==='code'?'code':type==='edit'?'edit':type==='group'?'group':'file'}"></use></svg>`;}
function chevron(open){const b=document.createElement('button');b.className='chevron'+(open?'':' closed');b.innerHTML='<svg viewBox="0 0 16 16" fill="none"><path d="m3 6 5 5 5-5" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/></svg>';b.setAttribute('aria-expanded',String(open));b.setAttribute('aria-label',open?'收起过程':'展开过程');return b;}
function render(){
 $('stage').classList.toggle('edit-mode',mode==='edit');$('canvas-wrap').classList.toggle('reference-mode',mode==='reference');
 $('edit-mode').classList.toggle('active',mode==='edit');$('preview-mode').classList.toggle('active',mode==='preview');$('reference-mode').classList.toggle('active',mode==='reference');
 $('canvas-label').textContent=mode==='reference'?'原始截图':'复刻画布';$('mode-hint').textContent=mode==='edit'?'点击文字直接修改；点击图标展开详情。':mode==='preview'?'点击汇总行折叠过程；点击工具或思考查看详情。':'原图仅作对照，切回编辑即可修改。';
 $('stage').style.background=state.settings.bg;$('row-gap').value=state.settings.gap;$('canvas-bg').value=state.settings.bg;$('watermark-toggle').checked=state.settings.watermark;$('watermark-text').value=state.settings.watermarkText;$('undo').disabled=!history.length;
 const wm=$('watermarks');wm.replaceChildren();if(state.settings.watermark){for(let y=-6;y<1000;y+=140)for(let x=-14;x<1200;x+=440){const w=document.createElement('span');w.className='watermark';w.textContent=state.settings.watermarkText;w.style.left=x+'px';w.style.top=y+'px';wm.append(w);}}
 const content=$('stage-content');content.replaceChildren();let hiddenLevel=null;
 state.nodes.forEach((n,index)=>{
  const indent=n.indent||0;if(hiddenLevel!==null){if(indent>hiddenLevel)return;hiddenLevel=null;}
  if(index>0&&!summaryOpen)return;
  const wrap=document.createElement('div');wrap.className='row-wrap'+(n.id===selectedId?' selected':'');wrap.dataset.id=n.id;wrap.style.marginTop=Math.max(0,(n.gap??11)+(index>0?state.settings.gap-11:0))+'px';wrap.style.marginLeft=(indent*22)+'px';
  const row=document.createElement('div');row.className='trace-row '+n.type+(n.tinted?' tinted':'');row.style.fontSize=(n.size||(n.type==='plain'||n.type==='summary'?16:13))+'px';row.style.color=n.color||(n.type==='plain'?'#111111':'#626970');
  if(n.type!=='plain'&&n.type!=='summary'){const icon=document.createElement('button');icon.className='row-icon';icon.title='展开'+LABELS[n.type]+'详情';icon.setAttribute('aria-label',icon.title);icon.innerHTML=svgIcon(n.type);icon.addEventListener('click',e=>{e.stopPropagation();toggleDetail(n);});row.append(icon);}
  const text=document.createElement('span');text.className='row-text';text.textContent=n.text;text.contentEditable=String(mode==='edit');text.setAttribute('spellcheck','false');text.setAttribute('aria-label',LABELS[n.type]+'文字');
  text.addEventListener('focus',()=>selectNode(n.id));text.addEventListener('blur',()=>{const next=text.innerText.replace(/\r/g,'');if(next!==n.text){history.push(copy(state));n.text=next;save();render();}});
  text.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();text.blur();}if(e.key==='Escape'){text.textContent=n.text;text.blur();}});row.append(text);
  if(n.type==='summary'){const arrow=chevron(summaryOpen);arrow.addEventListener('click',e=>{e.stopPropagation();summaryOpen=!summaryOpen;render();});row.append(arrow);}
  if(n.type==='group'){const arrow=chevron(!closedGroups.has(n.id));arrow.addEventListener('click',e=>{e.stopPropagation();toggleDetail(n);});row.append(arrow);if(closedGroups.has(n.id))hiddenLevel=indent;}
  row.addEventListener('click',()=>{if(mode==='edit')selectNode(n.id);else if(n.type==='summary'){summaryOpen=!summaryOpen;render();}else if(n.type!=='plain')toggleDetail(n);});wrap.append(row);
  if(openDetails.has(n.id)&&n.type!=='group'){const detail=document.createElement('div');detail.className='inline-detail'+(n.detail?'':' empty');detail.textContent=n.detail||'截图未包含此项展开内容，可在右侧编辑面板补充。';wrap.append(detail);}
  content.append(wrap);
 });
 renderEditor();renderList();
}
function toggleDetail(n){if(n.type==='group'){if(closedGroups.has(n.id))closedGroups.delete(n.id);else closedGroups.add(n.id);}else{if(openDetails.has(n.id))openDetails.delete(n.id);else openDetails.add(n.id);}selectedId=n.id;render();}
function selectNode(id){selectedId=id;document.querySelectorAll('.row-wrap').forEach(el=>el.classList.toggle('selected',el.dataset.id===id));renderEditor();renderList();}
function renderEditor(){
 const panel=$('selected-editor'),n=selected();panel.replaceChildren();if(!n){const hint=document.createElement('div');hint.className='empty-hint';hint.innerHTML='点击画布中的一条消息，<br>或在下方列表中选择。';panel.append(hint);return;}
 const label=document.createElement('div');label.className='section-label';label.textContent='当前消息 · '+LABELS[n.type];panel.append(label);
 const field=(title,el)=>{const l=document.createElement('label');l.className='field';l.append(document.createTextNode(title),el);return l;};
 const text=document.createElement('textarea');text.value=n.text;text.setAttribute('aria-label','修改消息文字');text.addEventListener('change',()=>mutate(()=>n.text=text.value));panel.append(field('显示文字',text));
 const cols=document.createElement('div');cols.className='two-col';const type=document.createElement('select');for(const [v,t]of Object.entries(LABELS)){if(v==='summary'&&n.type!=='summary')continue;const o=document.createElement('option');o.value=v;o.textContent=t;type.append(o);}type.value=n.type;type.disabled=n.type==='summary';type.addEventListener('change',()=>mutate(()=>n.type=type.value));cols.append(field('消息类型',type));
 const size=document.createElement('input');size.type='number';size.min=10;size.max=28;size.value=n.size||(n.type==='plain'||n.type==='summary'?16:13);size.addEventListener('change',()=>{const v=Number(size.value);if(v>=10&&v<=28)mutate(()=>n.size=v);});cols.append(field('字号',size));panel.append(cols);
 const cols2=document.createElement('div');cols2.className='two-col';const color=document.createElement('input');color.type='color';color.value=n.color||(n.type==='plain'?'#111111':'#626970');color.addEventListener('change',()=>mutate(()=>n.color=color.value));cols2.append(field('文字颜色',color));const indent=document.createElement('select');for(let i=0;i<=3;i++){const o=document.createElement('option');o.value=i;o.textContent=i===0?'不缩进':'第'+i+'级缩进';indent.append(o);}indent.value=n.indent||0;indent.disabled=n.type==='summary';indent.addEventListener('change',()=>mutate(()=>n.indent=Number(indent.value)));cols2.append(field('层级',indent));panel.append(cols2);
 if(n.type!=='plain'&&n.type!=='summary'){const detail=document.createElement('textarea');detail.className='detail-input';detail.value=n.detail||'';detail.placeholder='可补充思考正文、文件内容或执行结果';detail.addEventListener('change',()=>mutate(()=>n.detail=detail.value));panel.append(field('展开后的内容',detail));}
 const tint=document.createElement('label');tint.className='check-label';const c=document.createElement('input');c.type='checkbox';c.checked=!!n.tinted;c.addEventListener('change',()=>mutate(()=>n.tinted=c.checked));tint.append(c,document.createTextNode('显示浅灰底色'));panel.append(tint);
 const actions=document.createElement('div');actions.className='tool-actions';actions.style.marginTop='13px';for(const [label,action,disabled]of [['上移',()=>moveNode(-1),state.nodes.indexOf(n)<=1],['下移',()=>moveNode(1),n.type==='summary'||state.nodes.indexOf(n)===state.nodes.length-1],['复制',duplicateNode,n.type==='summary'],['删除',deleteNode,n.type==='summary']]){const b=document.createElement('button');b.className='btn'+(label==='删除'?' danger':'');b.textContent=label;b.disabled=disabled;b.addEventListener('click',action);actions.append(b);}panel.append(actions);
 if(n.type==='group'){const p=document.createElement('p');p.className='select-note';p.textContent='将后续消息设为更深一级缩进，即可收入这个折叠分组。';panel.append(p);}
}
function renderList(){const list=$('node-list');list.replaceChildren();state.nodes.forEach((n,i)=>{const b=document.createElement('button');b.className='node-button'+(n.id===selectedId?' selected':'');b.style.paddingLeft=(8+(n.indent||0)*10)+'px';const index=document.createElement('span');index.className='order';index.textContent=String(i+1).padStart(2,'0');const t=document.createElement('span');t.className='ellipsis';t.textContent=n.text||LABELS[n.type];b.append(index,t);b.title=n.text;b.addEventListener('click',()=>{selectNode(n.id);if(mode!=='edit'){mode='edit';render();}});list.append(b);});}
function moveNode(direction){const n=selected(),i=state.nodes.indexOf(n),j=i+direction;if(i<=0||j<=0||j>=state.nodes.length)return;mutate(()=>[state.nodes[i],state.nodes[j]]=[state.nodes[j],state.nodes[i]]);}
function newId(){return 'n-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,7);}
function addNode(type){const at=selectedId?state.nodes.findIndex(n=>n.id===selectedId)+1:state.nodes.length;const n={id:newId(),type,text:type==='plain'?'在这里填写阶段反馈':type==='group'?'制作与检查（点击展开）':'读取文件或执行操作',gap:11,indent:0};mutate(()=>{state.nodes.splice(at,0,n);selectedId=n.id;summaryOpen=true;mode='edit';});}
function duplicateNode(){const n=selected();if(!n||n.type==='summary')return;mutate(()=>{const clone=copy(n);clone.id=newId();state.nodes.splice(state.nodes.indexOf(n)+1,0,clone);selectedId=clone.id;});}
function deleteNode(){const n=selected();if(!n||n.type==='summary')return;mutate(()=>{state.nodes.splice(state.nodes.indexOf(n),1);selectedId=null;});}
function toast(text){$('toast').textContent=text;$('toast').classList.add('show');clearTimeout(toast.timeout);toast.timeout=setTimeout(()=>$('toast').classList.remove('show'),2200);}
function download(name,text,mime){const a=document.createElement('a');const url=URL.createObjectURL(new Blob([text],{type:mime}));a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);}
function exportHtml(){document.activeElement?.blur();const clone=document.documentElement.cloneNode(true);clone.querySelector('#seed').textContent=JSON.stringify(state).replace(/</g,'\\u003c');clone.querySelector('#toast').classList.remove('show');download('AI_PPT_3.0_Editable_UI.html','<!doctype html>\n'+clone.outerHTML,'text/html;charset=utf-8');toast('已导出可独立打开的 HTML');}
$('edit-mode').onclick=()=>{mode='edit';render();};$('preview-mode').onclick=()=>{mode='preview';selectedId=null;render();};$('reference-mode').onclick=()=>{mode='reference';selectedId=null;render();};
$('undo').onclick=()=>{if(!history.length)return;state=history.pop();selectedId=nodeById(selectedId)?selectedId:null;save();render();toast('已撤销');};
$('reset').onclick=()=>{if(!confirm('还原到原始截图内容？当前改动可先导出保存。'))return;mutate(()=>{state=copy(ORIGINAL);selectedId=null;summaryOpen=true;openDetails.clear();closedGroups.clear();});toast('已还原');};
$('export-html').onclick=exportHtml;$('add-text').onclick=()=>addNode('plain');$('add-tool').onclick=()=>addNode('file');$('add-group').onclick=()=>addNode('group');
$('row-gap').onchange=e=>{const v=Number(e.target.value);if(v>=0&&v<=40)mutate(()=>state.settings.gap=v);};$('canvas-bg').onchange=e=>{if(/^#[\da-f]{6}$/i.test(e.target.value))mutate(()=>state.settings.bg=e.target.value);else{e.target.value=state.settings.bg;toast('请输入六位颜色值，例如 #fafafa');}};$('watermark-toggle').onchange=e=>mutate(()=>state.settings.watermark=e.target.checked);$('watermark-text').onchange=e=>mutate(()=>state.settings.watermarkText=e.target.value);
$('export-json').onclick=()=>download('AI_PPT_3.0_UI_Config.json',JSON.stringify(state,null,2),'application/json');$('import-json').onclick=()=>$('import-file').click();$('import-file').onchange=async e=>{const file=e.target.files[0];if(!file)return;try{const v=JSON.parse(await file.text());if(!validState(v))throw new Error('invalid');mutate(()=>{state=v;selectedId=null;summaryOpen=true;openDetails.clear();closedGroups.clear();});toast('配置已导入');}catch{toast('配置格式不正确，请使用本页面导出的 JSON');}e.target.value='';};
document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='s'){e.preventDefault();exportHtml();}if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='z'&&!e.target.isContentEditable&&!['TEXTAREA','INPUT'].includes(e.target.tagName)){e.preventDefault();$('undo').click();}});
render();
</script>

<dialog id="version-dialog" class="version-dialog" aria-labelledby="version-title">
 <div class="version-header"><h2 id="version-title">版本历史</h2><button class="version-close" id="version-close" aria-label="关闭版本历史">×</button></div>
 <div class="version-body"><p class="version-note">保存当前文字、图标、分组、待办及样式。版本保存在当前浏览器，导出备份后可在其他设备导入。</p>
 <form class="version-form" id="version-form"><input id="version-name" maxlength="80" placeholder="版本名称，例如：方案二 · 合并思考" aria-label="版本名称"><button class="btn primary" type="submit">保存当前版本</button></form>
 <p class="version-error" id="version-error" role="status"></p><div class="version-list" id="version-list"></div>
 <div class="version-bottom"><button class="btn" id="version-export">导出全部版本</button><button class="btn" id="version-import">导入版本备份</button><input type="file" id="version-file" accept=".json,application/json" hidden></div></div>
</dialog>
<script>
(()=>{
 const scope='specs',key='aippt-version-history-v1-'+scope;
 const el=id=>document.getElementById(id),dlg=el('version-dialog');
 let versions=[];
 function error(message=''){el('version-error').textContent=message;}
 function load(){try{const raw=JSON.parse(localStorage.getItem(key)||'[]');if(!Array.isArray(raw)||!raw.every(validVersion))throw Error();versions=raw;return true;}catch{error('版本记录无法读取，未覆盖原有数据。');return false;}}
 function validVersion(v){return v&&typeof v.id==='string'&&typeof v.name==='string'&&v.name.length<=80&&typeof v.createdAt==='string'&&Number.isFinite(Date.parse(v.createdAt))&&validState(v.state);}
 function persist(next){try{localStorage.setItem(key,JSON.stringify(next));versions=next;error();return true;}catch{error('保存失败：浏览器存储空间不足或不可用。请先导出备份。');return false;}}
 function snapshot(name){return {id:newId(),name,createdAt:new Date().toISOString(),state:copy(state)};}
 function defaultName(){return '方案 '+(versions.length+1)+' · '+new Date().toLocaleString('zh-CN',{month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'});}
 function draw(){const list=el('version-list');list.replaceChildren();el('version-export').disabled=!versions.length;
 if(!versions.length){const p=document.createElement('p');p.className='version-empty';p.textContent='还没有保存的版本，先给当前方案留一份快照。';list.append(p);}
 versions.forEach(v=>{const row=document.createElement('div');row.className='version-entry';const info=document.createElement('div');info.className='version-info';const title=document.createElement('strong');title.textContent=v.name;const date=document.createElement('small');date.textContent=new Date(v.createdAt).toLocaleString('zh-CN')+' · '+v.state.nodes.length+'条记录';info.append(title,date);const actions=document.createElement('div');actions.className='version-buttons';
 const restore=document.createElement('button');restore.className='btn primary';restore.textContent='恢复';restore.onclick=()=>{if(!load())return;const target=versions.find(x=>x.id===v.id);if(!target)return;const backup=snapshot('恢复前自动备份');if(!persist([backup,...versions]))return;mutate(()=>{state=copy(target.state);selectedId=null;summaryOpen=true;});dlg.close();toast('已恢复：'+target.name+'；原方案已自动备份');};
 const del=document.createElement('button');del.className='btn danger';del.textContent='删除';del.onclick=()=>{if(!confirm('删除版本“'+v.name+'”？当前画布不受影响。'))return;if(!load())return;if(persist(versions.filter(x=>x.id!==v.id)))draw();};actions.append(restore,del);row.append(info,actions);list.append(row);});}
 el('versions-open').onclick=()=>{document.activeElement?.blur();error();dlg.showModal();if(load()){draw();el('version-name').value='';}el('version-name').focus();};
 el('version-close').onclick=()=>dlg.close();
 el('version-form').onsubmit=e=>{e.preventDefault();if(!load())return;const name=el('version-name').value.trim()||defaultName();if(persist([snapshot(name),...versions])){draw();el('version-name').value='';toast('版本已保存');}};
 el('version-export').onclick=()=>{if(!load())return;download('AI_PPT_'+scope+'_版本备份.json',JSON.stringify({format:'aippt-version-history',version:1,scope,versions},null,2),'application/json');};
 el('version-import').onclick=()=>el('version-file').click();el('version-file').onchange=async e=>{const file=e.target.files[0];if(!file)return;try{const data=JSON.parse(await file.text());if(data.format!=='aippt-version-history'||data.scope!==scope||!Array.isArray(data.versions)||!data.versions.every(validVersion))throw Error();if(!load())return;const ids=new Set(versions.map(v=>v.id));const added=data.versions.filter(v=>!ids.has(v.id));if(persist([...added,...versions])){draw();toast('已导入'+added.length+'个版本');}}catch{error('备份格式不正确或不属于此页面，请选择本页面导出的版本备份。');}e.target.value='';};
})();
</script></body></html>
