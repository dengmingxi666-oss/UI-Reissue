 const size=document.createElement('input');size.type='number';size.min=12;size.max=28;size.value=n.iconSize||16;size.onchange=()=>{const v=Number(size.value);if(v>=12&&v<=28)mutate(()=>n.iconSize=v);else size.value=n.iconSize||16;};cols.append(field('图标大小（px）',size));
 const color=document.createElement('input');color.type='color';color.value=n.iconColor||'#42474b';color.onchange=()=>mutate(()=>n.iconColor=color.value);cols.append(field('图标颜色',color));box.append(cols);
 const actions=document.createElement('div');actions.className='tool-actions';
 const apply=document.createElement('button');apply.className='btn';apply.textContent='应用到同类消息';apply.onclick=()=>mutate(()=>{for(const item of state.nodes)if(item.type===n.type){for(const k of ['icon','iconSize','iconColor']){if(n[k]===undefined)delete item[k];else item[k]=n[k];}}});
 const reset=document.createElement('button');reset.className='btn';reset.textContent='恢复默认';reset.onclick=()=>mutate(()=>{delete n.icon;delete n.iconSize;delete n.iconColor;});actions.append(apply,reset);box.append(actions);panel.append(box);
}

try{const saved=JSON.parse(localStorage.getItem(STORAGE_KEY));if(validState(saved))state=saved;}catch{}
function validState(v){return !!v&&v.version===1&&v.settings&&typeof v.settings.bg==='string'&&/^#[\da-f]{6}$/i.test(v.settings.bg)&&Number.isFinite(v.settings.gap)&&v.settings.gap>=0&&v.settings.gap<=40&&typeof v.settings.watermarkText==='string'&&Array.isArray(v.nodes)&&v.nodes.length>0&&v.nodes.length<=300&&new Set(v.nodes.map(n=>n.id)).size===v.nodes.length&&v.nodes.every(n=>n&&validIcon(n)&&typeof n.id==='string'&&TYPES.includes(n.type)&&typeof n.text==='string'&&n.text.length<=15000&&(!n.detail||typeof n.detail==='string')&&(n.collapsed===undefined||typeof n.collapsed==='boolean')&&(n.expanded===undefined||typeof n.expanded==='boolean')&&(n.indent===undefined||Number.isFinite(n.indent)&&n.indent>=0&&n.indent<=3)&&(n.size===undefined||Number.isFinite(n.size)&&n.size>=10&&n.size<=28)&&(n.color===undefined||/^#[\da-f]{6}$/i.test(n.color)));}
function save(){try{localStorage.setItem(STORAGE_KEY,JSON.stringify(state));$('save-status').textContent='改动已自动保存';}catch{$('save-status').textContent='可导出文件保存改动';}}
function mutate(fn){history.push(copy(state));if(history.length>100)history.shift();fn();save();render();}
function nodeById(id){return state.nodes.find(n=>n.id===id);}
function selected(){return nodeById(selectedId);}
function svgIcon(type){return `<svg aria-hidden="true"><use href="#icon-${type==='think'?'think':type==='view'?'view':type==='code'?'code':type==='edit'?'edit':type==='group'?'group':'file'}"></use></svg>`;}
function chevron(open){const b=document.createElement('button');b.className='chevron'+(open?'':' closed');b.innerHTML='<svg viewBox="0 0 16 16" fill="none"><path d="m3 6 5 5 5-5" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/></svg>';b.setAttribute('aria-expanded',String(open));b.setAttribute('aria-label',open?'收起过程':'展开过程');return b;}
function render(){
 $('stage').classList.toggle('edit-mode',mode==='edit');$('canvas-wrap').classList.toggle('reference-mode',mode==='reference');
 $('edit-mode').classList.toggle('active',mode==='edit');$('preview-mode').classList.toggle('active',mode==='preview');$('reference-mode').classList.toggle('active',mode==='reference');
 $('canvas-label').textContent=mode==='reference'?'原始截图':'改进方案画布';$('mode-hint').textContent=mode==='edit'?'点击文字直接修改；点击图标展开详情。':mode==='preview'?'点击灰色过程组展开；切换编辑可修改文字与层级。':'原图仅作对照，切回编辑即可修改。';
 $('stage').style.background=state.settings.bg;$('row-gap').value=state.settings.gap;$('canvas-bg').value=state.settings.bg;$('watermark-toggle').checked=state.settings.watermark;$('watermark-text').value=state.settings.watermarkText;$('undo').disabled=!history.length;
 const wm=$('watermarks');wm.replaceChildren();if(state.settings.watermark){for(let y=-6;y<1000;y+=140)for(let x=-14;x<1200;x+=440){const w=document.createElement('span');w.className='watermark';w.textContent=state.settings.watermarkText;w.style.left=x+'px';w.style.top=y+'px';wm.append(w);}}
 const content=$('stage-content');content.replaceChildren();let hiddenLevel=null;
 state.nodes.forEach((n,index)=>{
  const indent=n.indent||0;if(hiddenLevel!==null){if(indent>hiddenLevel)return;hiddenLevel=null;}
  if(index>0&&!summaryOpen)return;
  const wrap=document.createElement('div');wrap.className='row-wrap'+(n.id===selectedId?' selected':'');wrap.dataset.id=n.id;wrap.style.marginTop=Math.max(0,(n.gap??11)+(index>0?state.settings.gap-11:0))+'px';wrap.style.marginLeft=(indent*22)+'px';
  const row=document.createElement('div');row.className='trace-row '+n.type+(n.tinted?' tinted':'');if(n.bold)row.style.fontWeight='700';row.style.fontSize=(n.size||(n.type==='plain'||n.type==='summary'?16:13))+'px';row.style.color=n.color||(n.type==='plain'?'#111111':'#626970');if(n.lineHeight)row.style.lineHeight=n.lineHeight+'px';
  if(n.type!=='plain'&&n.type!=='summary'&&n.icon!=='none'){const icon=document.createElement('button');icon.className='row-icon';icon.title='展开'+LABELS[n.type]+'详情';icon.setAttribute('aria-label',icon.title);icon.innerHTML=iconMarkup(n);const iconSize=n.iconSize||16;icon.style.width=iconSize+'px';icon.style.flexBasis=iconSize+'px';icon.style.color=n.iconColor||'#42474b';const glyph=icon.querySelector('svg');if(glyph){glyph.style.width=iconSize+'px';glyph.style.height=iconSize+'px';}icon.addEventListener('click',e=>{e.stopPropagation();toggleDetail(n);});row.append(icon);}
  const text=document.createElement('span');text.className='row-text';text.textContent=n.text;text.contentEditable=String(mode==='edit');text.setAttribute('spellcheck','false');text.setAttribute('aria-label',LABELS[n.type]+'文字');
  text.addEventListener('focus',()=>selectNode(n.id));text.addEventListener('blur',()=>{const next=text.innerText.replace(/\r/g,'');if(next!==n.text){history.push(copy(state));n.text=next;save();render();}});
  text.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();text.blur();}if(e.key==='Escape'){text.textContent=n.text;text.blur();}});row.append(text);
  if(n.type==='summary'){const arrow=chevron(summaryOpen);arrow.addEventListener('click',e=>{e.stopPropagation();summaryOpen=!summaryOpen;render();});row.append(arrow);}
  if(n.type==='group'){const arrow=chevron(!n.collapsed);arrow.addEventListener('click',e=>{e.stopPropagation();toggleDetail(n);});row.append(arrow);if(n.collapsed)hiddenLevel=indent;}
  row.addEventListener('click',()=>{if(mode==='edit')selectNode(n.id);else if(n.type==='summary'){summaryOpen=!summaryOpen;render();}else if(n.type!=='plain')toggleDetail(n);});wrap.append(row);
  if(n.expanded&&n.type!=='group'){const detail=document.createElement('div');detail.className='inline-detail'+(n.detail?'':' empty');detail.textContent=n.detail||'原截图未提供此项详情，可在右侧补充真实记录。';wrap.append(detail);}
  content.append(wrap);
 });
 renderEditor();renderList();
}
function toggleDetail(n){if(n.type==='group')n.collapsed=!n.collapsed;else n.expanded=!n.expanded;selectedId=n.id;save();render();}
function setGroups(collapsed){state.nodes.forEach(n=>{if(n.type==='group')n.collapsed=collapsed;else if(collapsed)n.expanded=false;});summaryOpen=true;save();render();}
function revealNode(id){const at=state.nodes.findIndex(n=>n.id===id),parents=[];for(let i=0;i<at;i++){const n=state.nodes[i];while(parents.length&&(parents.at(-1).indent||0)>=(n.indent||0))parents.pop();if(n.type==='group')parents.push(n);}while(parents.length&&(parents.at(-1).indent||0)>=(state.nodes[at].indent||0))parents.pop();parents.forEach(n=>n.collapsed=false);summaryOpen=true;}
function selectNode(id){selectedId=id;document.querySelectorAll('.row-wrap').forEach(el=>el.classList.toggle('selected',el.dataset.id===id));renderEditor();renderList();}
function renderEditor(){
 const panel=$('selected-editor'),n=selected();panel.replaceChildren();if(!n){const hint=document.createElement('div');hint.className='empty-hint';hint.innerHTML='点击画布中的一条消息，<br>或在下方列表中选择。';panel.append(hint);return;}
 const label=document.createElement('div');label.className='section-label';label.textContent='当前消息 · '+LABELS[n.type];panel.append(label);
 const field=(title,el)=>{const l=document.createElement('label');l.className='field';l.append(document.createTextNode(title),el);return l;};
 const text=document.createElement('textarea');text.value=n.text;text.setAttribute('aria-label','修改消息文字');text.addEventListener('change',()=>mutate(()=>n.text=text.value));panel.append(field('显示文字',text));
 const cols=document.createElement('div');cols.className='two-col';const type=document.createElement('select');for(const [v,t]of Object.entries(LABELS)){if(v==='summary'&&n.type!=='summary')continue;const o=document.createElement('option');o.value=v;o.textContent=t;type.append(o);}type.value=n.type;type.disabled=n.type==='summary';type.addEventListener('change',()=>mutate(()=>n.type=type.value));cols.append(field('消息类型',type));
 const size=document.createElement('input');size.type='number';size.min=10;size.max=28;size.value=n.size||(n.type==='plain'||n.type==='summary'?16:13);size.addEventListener('change',()=>{const v=Number(size.value);if(v>=10&&v<=28)mutate(()=>n.size=v);});cols.append(field('字号',size));panel.append(cols);
 const cols2=document.createElement('div');cols2.className='two-col';const color=document.createElement('input');color.type='color';color.value=n.color||(n.type==='plain'?'#111111':'#626970');color.addEventListener('change',()=>mutate(()=>n.color=color.value));cols2.append(field('文字颜色',color));const indent=document.createElement('select');for(let i=0;i<=3;i++){const o=document.createElement('option');o.value=i;o.textContent=i===0?'不缩进':'第'+i+'级缩进';indent.append(o);}indent.value=n.indent||0;indent.disabled=n.type==='summary';indent.addEventListener('change',()=>mutate(()=>n.indent=Number(indent.value)));cols2.append(field('层级',indent));panel.append(cols2);
 if(n.type!=='plain'&&n.type!=='summary'){const detail=document.createElement('textarea');detail.className='detail-input';detail.value=n.detail||'';detail.placeholder='可补充思考正文、文件内容或执行结果';detail.addEventListener('change',()=>mutate(()=>n.detail=detail.value));panel.append(field('展开后的内容',detail));}
 renderIconEditor(panel,n,field);
 const tint=document.createElement('label');tint.className='check-label';const c=document.createElement('input');c.type='checkbox';c.checked=!!n.tinted;c.addEventListener('change',()=>mutate(()=>n.tinted=c.checked));tint.append(c,document.createTextNode('显示浅灰底色'));panel.append(tint);
 const actions=document.createElement('div');actions.className='tool-actions';actions.style.marginTop='13px';for(const [label,action,disabled]of [['上移',()=>moveNode(-1),state.nodes.indexOf(n)<=0],['下移',()=>moveNode(1),n.type==='summary'||state.nodes.indexOf(n)===state.nodes.length-1],['复制',duplicateNode,n.type==='summary'],['删除',deleteNode,n.type==='summary']]){const b=document.createElement('button');b.className='btn'+(label==='删除'?' danger':'');b.textContent=label;b.disabled=disabled;b.addEventListener('click',action);actions.append(b);}panel.append(actions);
 if(n.type==='group'){const p=document.createElement('p');p.className='select-note';p.textContent='将后续消息设为更深一级缩进，即可收入这个折叠分组。';panel.append(p);const l=document.createElement('label');l.className='check-label';const cb=document.createElement('input');cb.type='checkbox';cb.checked=!!n.collapsed;cb.addEventListener('change',()=>{n.collapsed=cb.checked;save();render();});l.append(cb,document.createTextNode('收起此分组'));panel.append(l);}
}
function renderList(){const list=$('node-list');list.replaceChildren();state.nodes.forEach((n,i)=>{const b=document.createElement('button');b.className='node-button'+(n.id===selectedId?' selected':'');b.style.paddingLeft=(8+(n.indent||0)*10)+'px';const index=document.createElement('span');index.className='order';index.textContent=String(i+1).padStart(2,'0');const t=document.createElement('span');t.className='ellipsis';t.textContent=n.text||LABELS[n.type];b.append(index,t);b.title=n.text;b.addEventListener('click',()=>{selectedId=n.id;revealNode(n.id);mode='edit';save();render();});list.append(b);});}
function moveNode(direction){const n=selected();if(!n||n.type==='summary')return;const [start,end]=nodeBlock(n),level=n.indent||0;if(direction<0){let previous=start-1;while(previous>=0&&(state.nodes[previous].indent||0)>level)previous--;if(previous<0||(state.nodes[previous].indent||0)!==level)return;mutate(()=>{const block=state.nodes.splice(start,end-start);state.nodes.splice(previous,0,...block);});}else{if(end>=state.nodes.length||(state.nodes[end].indent||0)!==level)return;const nextEnd=nodeBlock(state.nodes[end])[1];mutate(()=>{const block=state.nodes.splice(start,end-start);state.nodes.splice(nextEnd-block.length,0,...block);});}}
function newId(){return 'n-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,7);}
function addNode(type){const at=selectedId?state.nodes.findIndex(n=>n.id===selectedId)+1:state.nodes.length;const n={id:newId(),type,text:type==='plain'?'在这里填写阶段反馈':type==='group'?'制作与检查（点击展开）':'读取文件或执行操作',gap:11,indent:0};mutate(()=>{state.nodes.splice(at,0,n);selectedId=n.id;summaryOpen=true;mode='edit';});}
function nodeBlock(n){const start=state.nodes.indexOf(n);let end=start+1;if(n.type==='group')while(end<state.nodes.length&&(state.nodes[end].indent||0)>(n.indent||0))end++;return [start,end];}
function duplicateNode(){const n=selected();if(!n||n.type==='summary')return;mutate(()=>{const [start,end]=nodeBlock(n);const clones=state.nodes.slice(start,end).map(item=>({...copy(item),id:newId()}));state.nodes.splice(end,0,...clones);selectedId=clones[0].id;});}
function deleteNode(){const n=selected();if(!n||n.type==='summary')return;mutate(()=>{const [start,end]=nodeBlock(n);state.nodes.splice(start,end-start);selectedId=null;});}
function toast(text){$('toast').textContent=text;$('toast').classList.add('show');clearTimeout(toast.timeout);toast.timeout=setTimeout(()=>$('toast').classList.remove('show'),2200);}
function download(name,text,mime){const a=document.createElement('a');const url=URL.createObjectURL(new Blob([text],{type:mime}));a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);}
function exportHtml(){document.activeElement?.blur();const clone=document.documentElement.cloneNode(true);clone.querySelector('#seed').textContent=JSON.stringify(state).replace(/</g,'\\u003c');clone.querySelector('#toast').classList.remove('show');download('AI_PPT_3.0_Improved_UI.html','<!doctype html>\n'+clone.outerHTML,'text/html;charset=utf-8');toast('已导出可独立打开的 HTML');}
$('edit-mode').onclick=()=>{mode='edit';render();};$('preview-mode').onclick=()=>{mode='preview';selectedId=null;render();};$('reference-mode').onclick=()=>{mode='reference';selectedId=null;render();};
$('undo').onclick=()=>{if(!history.length)return;state=history.pop();selectedId=nodeById(selectedId)?selectedId:null;save();render();toast('已撤销');};
$('reset').onclick=()=>{if(!confirm('还原到改进版初始界面？当前改动可先导出保存。'))return;mutate(()=>{state=copy(ORIGINAL);selectedId=null;summaryOpen=true;openDetails.clear();closedGroups.clear();});toast('已还原');};
$('expand-all').onclick=()=>setGroups(false);$('collapse-all').onclick=()=>setGroups(true);
$('export-html').onclick=exportHtml;$('add-text').onclick=()=>addNode('plain');$('add-tool').onclick=()=>addNode('file');$('add-group').onclick=()=>addNode('group');
$('row-gap').onchange=e=>{const v=Number(e.target.value);if(v>=0&&v<=40)mutate(()=>state.settings.gap=v);};$('canvas-bg').onchange=e=>{if(/^#[\da-f]{6}$/i.test(e.target.value))mutate(()=>state.settings.bg=e.target.value);else{e.target.value=state.settings.bg;toast('请输入六位颜色值，例如 #fafafa');}};$('watermark-toggle').onchange=e=>mutate(()=>state.settings.watermark=e.target.checked);$('watermark-text').onchange=e=>mutate(()=>state.settings.watermarkText=e.target.value);
$('export-json').onclick=()=>download('AI_PPT_3.0_Improved_Config.json',JSON.stringify(state,null,2),'application/json');$('import-json').onclick=()=>$('import-file').click();$('import-file').onchange=async e=>{const file=e.target.files[0];if(!file)return;try{const v=JSON.parse(await file.text());if(!validState(v))throw new Error('invalid');mutate(()=>{state=v;selectedId=null;summaryOpen=true;openDetails.clear();closedGroups.clear();});toast('配置已导入');}catch{toast('配置格式不正确，请使用本页面导出的 JSON');}e.target.value='';};
document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='s'){e.preventDefault();exportHtml();}if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='z'&&!e.target.isContentEditable&&!['TEXTAREA','INPUT'].includes(e.target.tagName)){e.preventDefault();$('undo').click();}});
render();
</script>
